  <!-- Top ledger header metadata -->
  <text x="60" y="34" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="1.2" fill="#50555E">TRACEWEAVE SPECIFICATION // 0.1.0-DRAFT.1</text>
  <rect x="976" y="20" width="164" height="22" rx="2" fill="#DCF2EC" stroke="#096B56" stroke-width="1"/>
  <text x="1058" y="35" text-anchor="middle" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="0.8" fill="#096B56">OPEN · LOCAL-FIRST</text>

  <!-- Left column: Official mark + wordmark + tagline -->
  <g transform="translate(60 102) scale(2.25)">
    <path d="M2 2H8V4H4V8H2V2ZM24 2H30V8H28V4H24V2ZM2 24H4V28H8V30H2V24ZM28 24H30V30H24V28H28V24Z" fill="#111317"/>
    <rect x="8" y="8" width="6" height="6" fill="#111317"/>
    <rect x="18" y="18" width="6" height="6" fill="#111317"/>
    <path fill-rule="evenodd" d="M8 18H14V24H8V18ZM10 20V22H12V20H10Z" fill="#111317"/>
    <rect x="14" y="10" width="4" height="2" fill="#096B56"/>
    <rect x="18" y="8" width="6" height="6" fill="#096B56"/>
  </g>

  <text x="152" y="156" font-family="'IBM Plex Sans', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#111317">Traceweave</text>
  <text x="60" y="212" font-family="'IBM Plex Sans', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#111317">Open specification for local-first content fingerprinting</text>
  <text x="60" y="240" font-family="'IBM Plex Sans', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#111317">and verifiable cryptographic provenance.</text>
  <text x="60" y="278" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#50555E">Your content never leaves your machine — only fingerprints are compared.</text>

