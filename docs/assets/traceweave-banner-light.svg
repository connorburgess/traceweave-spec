<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="tw-banner-title tw-banner-desc">
  <title id="tw-banner-title">Traceweave — Open Specification for Local-First Content Fingerprinting and Cryptographic Provenance</title>
  <desc id="tw-banner-desc">Editorial Evidence Ledger banner showing the Traceweave mark, title, tagline, and an archival verification hash grid with a single signal-green matched thread.</desc>

  <!-- Outer ledger sheet -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="4" fill="#F9F9F7" stroke="#D2D4D8" stroke-width="1"/>

  <!-- Subtle background vertical ledger rules -->
  <g stroke="#ECECE8" stroke-width="1">
    <line x1="60" y1="52" x2="60" y2="308"/>
    <line x1="816" y1="52" x2="816" y2="308"/>
    <line x1="1140" y1="52" x2="1140" y2="308"/>
  </g>

  <!-- Top & bottom hairline rules -->
  <line x1="24" y1="52" x2="1176" y2="52" stroke="#D2D4D8" stroke-width="1"/>
  <line x1="24" y1="308" x2="1176" y2="308" stroke="#D2D4D8" stroke-width="1"/>

  <!-- Print registration corner crops -->
  <g stroke="#50555E" stroke-width="1.2" fill="none">
    <path d="M16 28 V16 H28"/>
    <path d="M1172 16 H1184 V28"/>
    <path d="M16 332 V344 H28"/>
    <path d="M1172 344 H1184 V332"/>
